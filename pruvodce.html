<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Kde co najdeš</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#EEEEEB;--card:#FFFFFF;--ink:#17181A;--dim:#565A58;--faint:#868B88;--ln:#C4C4BE;--warn:#B02A18;
  --ui:"Archivo","Segoe UI",Roboto,system-ui,sans-serif;--mn:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#17181A;--card:#1E2022;--ink:#E9EAE7;--dim:#9DA19E;--faint:#6C7270;--ln:#3C4042;--warn:#E0654F}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:24px 16px}
form{width:100%;max-width:360px}
.kick{font-family:var(--mn);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
h1{font-family:"Anton",sans-serif;font-weight:400;font-size:56px;line-height:.95;text-transform:uppercase;margin:10px 0 0}
p{font-size:16px;line-height:1.45;color:var(--dim);margin:14px 0 22px}
input[type=password]{width:100%;height:54px;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink);
  font-size:18px;padding:0 14px;outline:none}
input[type=password]:focus{box-shadow:0 0 0 3px var(--ln)}
label.zap{display:flex;align-items:center;gap:10px;margin:14px 0 18px;font-size:15px;color:var(--dim)}
label.zap input{width:20px;height:20px;accent-color:var(--ink);margin:0}
button{width:100%;height:54px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font-family:var(--mn);
  font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.6}
.chyba{min-height:22px;margin-top:12px;font-size:15px;color:var(--warn)}
</style>
</head>
<body>
<form id="zamek" autocomplete="on">
  <div class="kick">Kostýmní návaznost · prototyp</div>
  <h1>Kde co najdeš</h1>
  <p>Zadej heslo k prototypu. Není to heslo k žádnému tvému účtu.</p>
  <input type="password" id="heslo" name="password" autocomplete="current-password" autocapitalize="none" autocorrect="off"
    spellcheck="false" enterkeyhint="go" aria-label="Heslo" placeholder="Heslo" required>
  <label class="zap"><input type="checkbox" id="pamet" checked> Zapamatovat na tomto zařízení</label>
  <button type="submit" id="otevrit">Otevřít</button>
  <div class="chyba" id="chyba" role="alert"></div>
</form>
